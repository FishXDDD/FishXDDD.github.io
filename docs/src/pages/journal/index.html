<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf5">
  <title>日记本 · 沿途手记</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf5;
      --ink: #4f6253;
      --muted: #8a968b;
      --line: #e3e9df;
      --accent: #dfead9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    main {
      width: min(680px, calc(100% - 48px));
      margin: 0 auto;
      padding: 18vh 0 64px;
    }

    .mark {
      width: 42px;
      height: 10px;
      margin-bottom: 28px;
      border-radius: 999px;
      background: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 7vw, 48px);
      letter-spacing: -.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 64px;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 14px;
      text-decoration: none;
    }

    a:hover { border-color: var(--ink); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>日记本</h1>
    <p>一些普通日子，慢慢写。</p>
    <a href="../index.html">← 返回首页</a>
  </main>
</body>
</html>
